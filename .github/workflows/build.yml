name: delua CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      rebuild_engine:
        description: 'Rebuild native engine (.so + .dex)'
        required: false
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lintArm64Debug

  build-arm64:
    name: Build ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build ARM64 debug APK
        run: ./gradlew assembleArm64Debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delua-arm64-debug
          path: app/build/outputs/apk/arm64/debug/*.apk

  build-x64:
    name: Build x86_64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build x86_64 debug APK
        run: ./gradlew assembleX64Debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delua-x64-debug
          path: app/build/outputs/apk/x64/debug/*.apk

  rebuild-engine:
    name: Rebuild Native Engine
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_engine }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install NDK component
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install 'ndk;26.1.10909125'

      - name: Rebuild native libs
        run: |
          chmod +x scripts/rebuild_engine.sh
          ./scripts/rebuild_engine.sh all

      - name: Install d8 (DEX compiler)
        run: |
          echo "d8 is bundled with Android SDK build-tools"
          echo "Checking for d8..."
          which d8 || find $ANDROID_SDK_ROOT -name "d8" -type f 2>/dev/null

      - name: Upload rebuilt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-artifacts
          path: |
            prebuilt/
            app/src/main/jniLibs/
