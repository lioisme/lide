name: lide CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        # :app lint 已依赖自身 ktlintCheck；2026-08-08 源码组织审计 :editor 模块并单，
        # ktlint 门禁随 :app 单模块全量覆盖（含 com.lioisme.lide.editor 包）。
        run: ./gradlew lintArm64Debug :app:ktlintCheck

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run JVM unit tests
        # :androlua tests included (P2#17): AXml manifest patch round-trip against
        # regenerated aapt2 fixture + Lua compiler/config/permission resolvers.
        # :editor tests merged into :app since 2026-08-08 (editor module merged).
        run: ./gradlew :app:testX64DebugUnitTest :androlua:testDebugUnitTest

  build-arm64:
    name: Build ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Native engine (.so) is built by AGP externalNativeBuild from
      # app/src/main/cpp at assemble time; only the NDK component is provisioned.
      - name: Install NDK component
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install 'ndk;29.0.14206865'

      - name: Build ARM64 debug APK (engine built by AGP)
        run: ./gradlew assembleArm64Debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lide-arm64-debug
          path: app/build/outputs/apk/arm64/debug/*.apk

  build-x64:
    name: Build x86_64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK component
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install 'ndk;29.0.14206865'

      - name: Build x86_64 debug APK (engine built by AGP)
        run: ./gradlew assembleX64Debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lide-x64-debug
          path: app/build/outputs/apk/x64/debug/*.apk

  verify-release:
    name: Verify Release R8 Surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK component
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install 'ndk;29.0.14206865'

      - name: Build release + verify Lua-visible API surface + minimalism gate
        # verifyMinimalism（2026-08-07）：release APK 载荷体检——无 jniLibs 预编译回包、
        # 无重复原生库、默认零内置示例；与 verifyReleaseLuaSurface 共享一次 assembleArm64Release。
        run: ./gradlew verifyReleaseLuaSurface verifyMinimalism

  verify-no-binaries:
    name: Verify No Prebuilt Binaries in Repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # R5 red line: native engine exists ONLY as source (app/src/main/cpp);
      # no prebuilt .so/.dex/.zip and no jar other than the wrapper bootstrap
      # may be tracked. AGP builds engines at src time, so this stays green.
      - name: Verify no binaries are tracked
        run: |
          test "$(git ls-files '*.so' | wc -l)" = "0"
          test "$(git ls-files '*.dex' | wc -l)" = "0"
          test "$(git ls-files '*.zip' | wc -l)" = "0"
          test "$(git ls-files '*.jar' | grep -v 'gradle/wrapper/gradle-wrapper.jar' | wc -l)" = "0"
          echo "OK: no binary .so/.dex/.zip/.jar tracked (wrapper jar exempt)"

  verify-r1:
    name: Verify R1 Boundary (editor package clean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # R1 red line (2026-08-08 :editor module merged into :app): the
      # com.lioisme.lide.editor package must stay pure JVM (no luajava/androlua/
      # System.loadLibrary). Editor Lint/diagnostics/completion are pure
      # Kotlin/Java; Lua runtime lives in the host engine dex only.
      - name: R1 grep gate (P3)
        run: |
          if grep -rnE 'luajava|androlua|loadLibrary' app/src/main/kotlin/com/lioisme/lide/editor; then
            echo "FAIL: R1 boundary violated in editor package (luajava|androlua|loadLibrary)"
            exit 1
          fi
          echo "OK: no luajava|androlua|loadLibrary in editor package"

  verify-vendor:
    name: Verify Vendor Isolation (R-2/R-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # R-2/R-3 red line (源码组织审计 Phase 2, 2026-08-08): upstream dirs
      # (androlua / sora-editor) must contain zero com/lioisme/** code and the
      # UPSTREAM.md change ledger must stay consistent with actual sources
      # (W^X InMemoryDexClassLoader fix, androidx.annotation stripped, zero
      # third-party deps in :androlua build script, vendored builds self-contained).
      - name: Run verifyVendorIsolation gate
        run: ./gradlew :app:verifyVendorIsolation