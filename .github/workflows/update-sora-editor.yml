name: update-sora-editor

# P3（D3）：每周自动检查 sora-editor 上游新 release；
# 有新版则跑 scripts/update-sora-editor.ps1 → 本地门禁 → 全绿自动开 PR。
# 构建失败时同样开 PR（标题带 ⚠），附失败日志，人工接管。
on:
  schedule:
    # 每周一 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    name: Update sora-editor & open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK component
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install 'ndk;29.0.14206865'

      - name: Check upstream version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(cat third_party/sora-editor/VERSION)
          LATEST=$(gh api repos/Rosemoe/sora-editor/releases/latest --jq .tag_name)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT / Latest: $LATEST"

      - name: Run update script
        id: update
        if: steps.version.outputs.latest != steps.version.outputs.current
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/update-sora-editor.ps1 -Tag "${{ steps.version.outputs.latest }}" -SkipBuild
          echo "script_rc=$LASTEXITCODE" >> "$env:GITHUB_ENV"

      - name: Full gates
        if: steps.version.outputs.latest != steps.version.outputs.current
        continue-on-error: true
        run: |
          ./gradlew :editor:testDebugUnitTest :app:compileArm64DebugKotlin :app:assembleArm64Debug --console=plain
          echo "gates_rc=$?" >> "$GITHUB_ENV"

      - name: Open pull request
        if: steps.version.outputs.latest != steps.version.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="ci/sora-${{ steps.version.outputs.latest }}"
          git config user.name 'lide-ci[bot]'
          git config user.email 'lide-ci[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(third_party): bump sora-editor ${{ steps.version.outputs.current }} -> ${{ steps.version.outputs.latest }}"
          git push origin "$BRANCH"

          if [ "${script_rc:-0}${gates_rc:-0}" = "00" ]; then
            TITLE="chore(third_party): bump sora-editor ${{ steps.version.outputs.current }} -> ${{ steps.version.outputs.latest }}"
            BODY="sora-editor 上游新版本。更新脚本 + 全部门禁（单测/编译/assemble）通过。"
          else
            TITLE="⚠ chore(third_party): bump sora-editor ${{ steps.version.outputs.current }} -> ${{ steps.version.outputs.latest }} (build failed)"
            BODY="sora-editor 上游新版本。更新脚本或门禁失败（script_rc=$script_rc, gates_rc=$gates_rc），请人工接管并附构建日志。"
          fi
          gh pr create --title "$TITLE" --body "$BODY" --head "$BRANCH" --base main

  verify-vendor:
    name: Verify vendored sources match upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream same-tag zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(cat third_party/sora-editor/VERSION)
          curl -sL "https://github.com/Rosemoe/sora-editor/archive/refs/tags/$TAG.zip" -o /tmp/up.zip
          unzip -q /tmp/up.zip -d /tmp/up
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls /tmp/up

      # 白名单：OnigNative.java 桩 + 两模块自写 build.gradle.kts（其余必须与上游逐字节一致）
      - name: Diff non-whitelisted sources
        run: |
          TAG=$(cat third_party/sora-editor/VERSION)
          UP=/tmp/up/sora-editor-$TAG
          for mod in editor language-textmate; do
            rm -f "third_party/sora-editor/$mod/build.gradle.kts"
            rm -f "third_party/sora-editor/$mod/src/main/java/io/github/rosemoe/oniguruma/OnigNative.java"
            diff -r "$UP/$mod/src/main" "third_party/sora-editor/$mod/src/main" > /tmp/diff.txt
            if [ -s /tmp/diff.txt ]; then
              echo "FAIL: $mod/src/main 与上游不一致（白名单外漂移）："
              head -40 /tmp/diff.txt
              exit 1
            fi
          done
          echo "OK: 两模块 src/main 与上游 $TAG 逐字节一致（白名单除外）"
